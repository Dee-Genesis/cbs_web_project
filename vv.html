<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verification Portal — CBS</title>
<link rel="icon" href="assets/logos/logo.png" type="image/png"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy:   #0b1e3d;
  --gold:   #c9972e;
  --gold-lt:#f0c86a;
  --white:  #ffffff;
  --off:    #f5f5f0;
  --text:   #2d2d2d;
  --muted:  #6b7280;
  --border: #e0ddd6;
  --radius: 6px;
  --transition: 0.3s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; color: var(--text); background: var(--off); min-height: 100vh; }
img { max-width: 100%; display: block; }
a { text-decoration: none; color: inherit; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
.container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

/* ---- header ---- */
header { background: var(--white); box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 1200px; margin: 0 auto; }
.nav-brand { display: flex; align-items: center; gap: 14px; }
.nav-brand img { height: 50px; width: auto; object-fit: contain; }
.nav-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.nav-brand-text .acronym { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 700; color: var(--navy); letter-spacing: 0.04em; line-height: 1; }
.nav-brand-text .fullname { font-family: 'Cormorant Garamond', serif; font-size: 0.72rem; font-weight: 600; color: var(--navy); text-transform: uppercase; letter-spacing: 0.1em; line-height: 1.3; }
.back-link { border: 1.5px solid var(--navy); color: var(--navy); padding: 9px 20px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; transition: all var(--transition); }
.back-link:hover { background: var(--navy); color: var(--white); }

/* ---- intro ---- */
.portal-intro { max-width: 720px; margin: 0 auto; padding: 4rem 24px 1rem; text-align: center; }
.section-tag { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; }
.section-tag::before, .section-tag::after { content: ''; display: block; width: 26px; height: 2px; background: var(--gold); }
.portal-title { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.5rem); color: var(--navy); line-height: 1.2; margin-bottom: 14px; }
.portal-sub { color: var(--muted); font-size: 1rem; line-height: 1.75; max-width: 540px; margin: 0 auto; }

/* ---- tabs ---- */
.tab-wrap { max-width: 760px; margin: 2.25rem auto 0; padding: 0 24px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tab-btn { font-size: 0.86rem; font-weight: 600; color: var(--navy); background: var(--white); border: 1.5px solid var(--border); padding: 10px 18px; border-radius: 30px; transition: all var(--transition); white-space: nowrap; }
.tab-btn:hover { border-color: var(--gold-lt); }
.tab-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

/* ---- card ---- */
.panel-wrap { max-width: 720px; margin: 0 auto; padding: 2.5rem 24px 5rem; }
.verify-card { background: var(--white); border-radius: 12px; box-shadow: 0 8px 32px rgba(11,30,61,0.08); overflow: hidden; }
.verify-form { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; padding: 2.25rem 2.25rem 2rem; border-bottom: 1px solid var(--border); }
.field { flex: 1; min-width: 220px; }
.field label { display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
.field input { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 1rem; padding: 0.75rem 1rem; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--off); transition: border-color 0.2s; }
.field input:focus { outline: none; border-color: var(--gold); background: var(--white); }
.verify-submit { background: var(--gold); color: var(--white); font-size: 0.86rem; font-weight: 600; letter-spacing: 0.02em; padding: 0.9rem 2rem; border-radius: 30px; transition: background var(--transition), transform var(--transition); flex-shrink: 0; }
.verify-submit:hover { background: var(--navy); transform: translateY(-1px); }
.verify-submit:disabled { background: var(--muted); cursor: default; transform: none; }
.verify-hint { font-size: 0.82rem; color: var(--muted); width: 100%; margin-top: -0.4rem; }

.result-area { padding: 2.25rem; }
.result-empty { color: var(--muted); font-size: 0.92rem; text-align: center; padding: 1.5rem 0; }

.result-status { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 1.5rem; }
.badge { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; font-size: 0.9rem; }
.badge.ok { background: #2f6b4f; color: var(--white); }
.badge.no { background: #b3402c; color: var(--white); }
.result-status-text { font-weight: 700; font-size: 1.05rem; }
.result-status-text.ok { color: #2f6b4f; }
.result-status-text.no { color: #b3402c; }

.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.result-grid.single-col { grid-template-columns: 1fr; }
.result-row { padding: 1rem 1.1rem; background: var(--off); border-radius: var(--radius); border: 1px solid var(--border); }
.result-row dt { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
.result-row dd { font-size: 1.02rem; color: var(--navy); font-weight: 500; }
.result-name-row { grid-column: 1 / -1; background: var(--white); border: 1px solid var(--gold-lt); }
.result-name-row dd { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; }

.limited-note { margin-top: 1.25rem; padding: 1rem 1.25rem; background: #fbf3e3; border-left: 3px solid var(--gold); border-radius: 0 var(--radius) var(--radius) 0; font-size: 0.88rem; line-height: 1.6; color: var(--text); }
.error-msg { font-size: 0.95rem; color: var(--text); line-height: 1.6; }

@media (max-width: 640px) {
  .result-grid { grid-template-columns: 1fr; }
  .verify-form { flex-direction: column; align-items: stretch; }
  .verify-submit { width: 100%; }
}
</style>
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="nav-brand">
      <img src="assets/logos/logo.png" alt="CBS Logo" onerror="this.style.display='none'">
      <div class="nav-brand-text">
        <span class="acronym">CBS</span>
      </div>
    </a>
    <a href="index.html" class="back-link">← Back to site</a>
  </nav>
</header>

<section class="portal-intro">
  <div class="section-tag">Verification Portal</div>
  <h1 class="portal-title">Confirm the authenticity of a CBS record</h1>
  <p class="portal-sub">Select a record type and enter the certificate number.</p>
</section>

<div class="tab-wrap">
  <div class="tabs" role="tablist">
    <button class="tab-btn active" data-type="degree" role="tab">Degree</button>
    <button class="tab-btn" data-type="diploma" role="tab">Diploma</button>
  </div>
</div>

<div class="panel-wrap">
  <div class="verify-card">
    <form class="verify-form" id="verifyForm">
      <div class="field">
        <label id="fieldLabel" for="numberInput">Degree Reference Number</label>
        <input type="text" id="numberInput" name="number" autocomplete="off" required maxlength="64">
      </div>
      <button class="verify-submit" type="submit" id="submitBtn">Verify</button>
      <p class="verify-hint" id="hintText">Enter the reference number found on your degree certificate.</p>
    </form>

    <div class="result-area" id="resultArea">
      <p class="result-empty">Your verification result will appear here.</p>
    </div>
  </div>
</div>

<script>
const ENDPOINT = 'verify.php';

const TYPES = {
  degree: {
    label: 'Degree',
    fieldLabel: 'Degree Reference Number',
    hint: 'Enter the reference number found on your degree certificate.',
    fields: [
      ['certificateFile', 'Full Name'],
      ['award', 'Program'],
      ['dateIssued', 'Date Issued']
    ]
  },
  diploma: {
    label: 'Diploma',
    fieldLabel: 'Diploma Reference Number',
    hint: 'Enter the reference number found on your diploma certificate.',
    fields: [
      ['certificateFile', 'Full Name'],
      ['award', 'Program'],
      ['dateIssued', 'Date Issued']
    ]
  }
};

let currentType = 'degree';

const tabs = document.querySelectorAll('.tab-btn');
const fieldLabel = document.getElementById('fieldLabel');
const numberInput = document.getElementById('numberInput');
const hintText = document.getElementById('hintText');
const resultArea = document.getElementById('resultArea');
const submitBtn = document.getElementById('submitBtn');
const form = document.getElementById('verifyForm');

function switchType(type) {
  if (submitBtn.disabled) return; // a check is in flight — ignore tab clicks until it resolves
  currentType = type;
  tabs.forEach(t => t.classList.toggle('active', t.dataset.type === type));
  const cfg = TYPES[type];
  fieldLabel.textContent = cfg.fieldLabel;
  hintText.textContent = cfg.hint;
  numberInput.value = '';
  resultArea.innerHTML = '<p class="result-empty">Your verification result will appear here.</p>';
}

tabs.forEach(tab => tab.addEventListener('click', () => switchType(tab.dataset.type)));

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const number = numberInput.value.trim();
  if (!number) return;

  const requestType = currentType; // lock in the tab this request belongs to

  submitBtn.disabled = true;
  submitBtn.textContent = 'Checking…';
  resultArea.innerHTML = '<p class="result-empty">Checking our records…</p>';

  try {
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ type: requestType, number })
    });
    const data = await res.json();
    if (requestType !== currentType) return; // tab changed while this was in flight — discard
    renderResult(data, requestType);
  } catch (err) {
    if (requestType !== currentType) return;
    resultArea.innerHTML = '<p class="error-msg">We could not reach the verification server. Please try again shortly.</p>';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Verify';
  }
});

function renderResult(data, forType) {
  const cfg = TYPES[forType];

  if (!data.valid) {
    resultArea.innerHTML = `
      <div class="result-status">
        <span class="badge no">✕</span>
        <span class="result-status-text no">Not Valid</span>
      </div>
      <p class="error-msg">${escapeHtml(data.message || 'We could not find a matching ' + cfg.label.toLowerCase() + ' record for that number.')}</p>
    `;
    return;
  }

  // If the backend is in "limited" mode (no award/date/fee columns yet),
  // only show fields that actually came back with a value.
  const fieldsToShow = data.limited
    ? cfg.fields.filter(([key]) => data.record?.[key] !== undefined && data.record?.[key] !== null)
    : cfg.fields;

  const rows = fieldsToShow.map(([key, label]) => {
    const isName = key === 'fullName' || key === 'certificateFile';
    return `<div class="result-row${isName ? ' result-name-row' : ''}">
              <dt>${escapeHtml(label)}</dt>
              <dd>${escapeHtml(data.record?.[key] ?? '—')}</dd>
            </div>`;
  }).join('');

  const limitedNote = data.limited
    ? `<p class="limited-note">This record is confirmed valid. Program and issue date aren't fully tracked in our system for this record type yet — contact CBS directly for those details.</p>`
    : '';

  resultArea.innerHTML = `
    <div class="result-status">
      <span class="badge ok">✓</span>
      <span class="result-status-text ok">${escapeHtml(cfg.label)} Verified</span>
    </div>
    <dl class="result-grid${fieldsToShow.length === 1 ? ' single-col' : ''}">${rows}</dl>
    ${limitedNote}
  `;
}
</script>

</body>
</html>
