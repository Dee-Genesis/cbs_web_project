<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>CBSEDU | Admin Dashboard</title>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
  <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.5.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/2.0.1/css/ionicons.min.css">
  <link rel="stylesheet" href="../dist/css/AdminLTE.min.css">
  <style>
    body { background: #ecf0f5; }
    .wrap { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .top-bar h1 { font-size: 22px; margin: 0; }
    .nav-tabs-custom { margin-bottom: 0; }
    table.table td, table.table th { vertical-align: middle; }
    .status-msg { padding: 10px 15px; border-radius: 4px; margin-bottom: 15px; display: none; }
    .status-msg.error { background: #f2dede; color: #a94442; border: 1px solid #ebccd1; }
    .status-msg.ok { background: #dff0d8; color: #3c763d; border: 1px solid #d6e9c6; }
    .loading-row td { text-align: center; color: #999; padding: 20px; }
    .btn-del { color: #a94442; }
    #gate { max-width: 400px; margin: 80px auto; text-align: center; color: #999; }
  </style>
</head>
<body class="hold-transition skin-blue">

<!-- Shown briefly while we confirm there's a valid session; also the
     fallback message if JS is somehow blocked. -->
<div id="gate"><p>Checking your session…</p></div>

<div class="wrap" id="dashboard" style="display:none;">

  <div class="top-bar">
    <h1><b>CBSEDU</b> Admin Dashboard</h1>
    <a href="login/index.php?logout" class="btn btn-default btn-sm">
      <i class="fa fa-sign-out"></i> Log out
    </a>
  </div>

  <div id="statusMsg" class="status-msg"></div>

  <div class="nav-tabs-custom">
    <ul class="nav nav-tabs">
      <li class="active"><a href="#membership" data-toggle="tab">Membership</a></li>
      <li><a href="#certificates" data-toggle="tab">Certificates</a></li>
    </ul>
    <div class="tab-content">

      <!-- Membership tab -->
      <div class="tab-pane active" id="membership">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Member No.</th>
              <th>Full Name</th>
              <th>Grade</th>
              <th>Date Issued</th>
              <th>Expiry Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="membershipRows">
            <tr class="loading-row"><td colspan="6">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Certificates tab -->
      <div class="tab-pane" id="certificates">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Reference No.</th>
              <th>Type</th>
              <th>Award</th>
              <th>Date Issued</th>
              <th>Expiry Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="certificateRows">
            <tr class="loading-row"><td colspan="6">Loading…</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="../plugins/jQuery/jquery-2.2.3.min.js"></script>
<script src="../bootstrap/js/bootstrap.min.js"></script>
<script>
var LOGIN_PATH = 'login/index.php';

function showStatus(message, isError) {
  var el = document.getElementById('statusMsg');
  el.textContent = message;
  el.className = 'status-msg ' + (isError ? 'error' : 'ok');
  el.style.display = 'block';
  window.scrollTo(0, 0);
  setTimeout(function () { el.style.display = 'none'; }, 4000);
}

function escapeHtml(str) {
  var d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

function loadMembership() {
  var tbody = document.getElementById('membershipRows');
  fetch('membership_actions.php?action=list')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) { throw new Error(data.message || 'Failed to load.'); }
      if (data.rows.length === 0) {
        tbody.innerHTML = '<tr class="loading-row"><td colspan="6">No membership records found.</td></tr>';
        return;
      }
      tbody.innerHTML = data.rows.map(function (row) {
        return '<tr>' +
          '<td>' + escapeHtml(row.memberNo) + '</td>' +
          '<td>' + escapeHtml(row.fullName) + '</td>' +
          '<td>' + escapeHtml(row.memberGrade) + '</td>' +
          '<td>' + escapeHtml(row.regDate) + '</td>' +
          '<td>' + escapeHtml(row.exDate) + '</td>' +
          '<td><button class="btn btn-xs btn-del" data-type="membership" data-id="' + escapeHtml(row.memberNo) + '"><i class="fa fa-trash"></i> Delete</button></td>' +
          '</tr>';
      }).join('');
    })
    .catch(function (err) {
      tbody.innerHTML = '<tr class="loading-row"><td colspan="6">Could not load records.</td></tr>';
      showStatus(err.message, true);
    });
}

function loadCertificates() {
  var tbody = document.getElementById('certificateRows');
  fetch('certificates_actions.php?action=list')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) { throw new Error(data.message || 'Failed to load.'); }
      if (data.rows.length === 0) {
        tbody.innerHTML = '<tr class="loading-row"><td colspan="6">No certificate records found.</td></tr>';
        return;
      }
      tbody.innerHTML = data.rows.map(function (row) {
        return '<tr>' +
          '<td>' + escapeHtml(row.memberNo) + '</td>' +
          '<td>' + escapeHtml(row.recordType || '—') + '</td>' +
          '<td>' + escapeHtml(row.award || '—') + '</td>' +
          '<td>' + escapeHtml(row.dateIssued || '—') + '</td>' +
          '<td>' + escapeHtml(row.expiryDate || '—') + '</td>' +
          '<td><button class="btn btn-xs btn-del" data-type="certificates" data-id="' + escapeHtml(row.memberNo) + '"><i class="fa fa-trash"></i> Delete</button></td>' +
          '</tr>';
      }).join('');
    })
    .catch(function (err) {
      tbody.innerHTML = '<tr class="loading-row"><td colspan="6">Could not load records.</td></tr>';
      showStatus(err.message, true);
    });
}

document.addEventListener('click', function (e) {
  var btn = e.target.closest('.btn-del');
  if (!btn) return;

  var type = btn.dataset.type; // 'membership' | 'certificates'
  var id = btn.dataset.id;
  if (!confirm('Delete this ' + (type === 'membership' ? 'membership' : 'certificate') + ' record (' + id + ')? This cannot be undone.')) {
    return;
  }

  var endpoint = type === 'membership' ? 'membership_actions.php' : 'certificates_actions.php';
  btn.disabled = true;

  fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ action: 'delete', memberNo: id })
  })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) { throw new Error(data.message || 'Delete failed.'); }
      showStatus('Record deleted.', false);
      if (type === 'membership') { loadMembership(); } else { loadCertificates(); }
    })
    .catch(function (err) {
      showStatus(err.message, true);
      btn.disabled = false;
    });
});

// ---- Session gate: check before showing the dashboard at all ----
fetch('session_check.php')
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (!data.loggedIn) {
      window.location.href = LOGIN_PATH;
      return;
    }
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = '';
    loadMembership();
    loadCertificates();
  })
  .catch(function () {
    // If we can't even confirm session state, safest default is to send
    // them to the login page rather than show a dashboard shell.
    window.location.href = LOGIN_PATH;
  });
</script>
</body>
</html>
